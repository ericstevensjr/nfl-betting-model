[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-betting-model"
version = "0.1.0"
description = "Professional NFL sports betting analytics and predictive modeling platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
	"pandas>2.3",
	"numpy>=2.5",
	"pyarrow>=21",
]

[project.optional-dependencies]
dev = [
	"pytest>=8",
	"pytest-cov>=6",
	"ruff>=0.16",
	"mypy>=1.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
